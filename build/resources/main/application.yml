server:
  port: 8080

spring:
  application:
    name: grabfood-fault-tolerance-service
  datasource:
    url: jdbc:h2:mem:dishdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      lettuce:
        pool:
          max-active: 10

logging:
  level:
    com.grabfood: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.cache: DEBUG
